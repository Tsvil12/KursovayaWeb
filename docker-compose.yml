version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: kursovaya_postgres
    environment:
      POSTGRES_DB: kursovaya_db
      POSTGRES_USER: kursovaya_user
      POSTGRES_PASSWORD: kursovaya_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kursovaya_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: